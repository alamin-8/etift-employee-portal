services:
  - type: web
    name: etift-employee-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://your-domain.com
      - key: ALLOWED_ORIGINS
        value: https://your-domain.com
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_PATH
        value: ./etift.db
